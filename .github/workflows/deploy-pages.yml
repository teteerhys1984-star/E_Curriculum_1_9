name: Deploy English Curriculum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site for publishing
        run: |
          mkdir -p _site
          cp *.html *.css *.js _site/
          mkdir -p _site/assets/fonts
          cp assets/fonts/*.woff2 _site/assets/fonts/
          cp -r assets/fonts/licenses _site/assets/fonts/
          for d in assets/*/crops assets/*/source; do
            mkdir -p "_site/$d"
            cp -r "$d/." "_site/$d/"
          done
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
