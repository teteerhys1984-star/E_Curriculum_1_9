name: Deploy English Curriculum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            *.html
            *.css
            *.js
            assets/fonts
            assets/grade3-unit1-lesson2/crops
            assets/grade3-unit1-lesson2/source
            assets/grade4-unit1-lesson2/crops
            assets/grade4-unit1-lesson2/source
            assets/grade5-unit1-lesson3/crops
            assets/grade5-unit1-lesson3/source

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
