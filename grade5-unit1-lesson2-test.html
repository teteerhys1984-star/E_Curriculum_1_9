<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 5 Lesson 2 Test — Family</title><style>body{margin:0;background:#0c0b1b;color:#fbf9ff;font:16px Arial,sans-serif}.banner{text-align:center;padding:12px;background:#34306a;border-bottom:2px solid #f4c96b}.banner a{color:white}.wrap{max-width:950px;margin:auto;padding:24px}.panel,.question{background:#17152d;border:1px solid #39345b;border-radius:16px;padding:18px;margin:14px 0;line-height:1.8}h1,h2{color:#a8ffe5}button{padding:10px 14px;border:0;border-radius:9px;background:#7957e8;color:white;cursor:pointer}label{display:block;margin:8px 0}input[type=password]{padding:10px;border-radius:8px;background:#0c0b1b;border:1px solid #514777;color:white}.answer{display:none;background:#123e3b;padding:12px;border-radius:10px}.answer.show{display:block}</style></head><body><div class="banner">المهندس سومر شاهين: <a href="tel:0930215022">0930215022</a></div><main class="wrap"><p><a href="grade5-unit1-lesson2.html">← Lesson 2 menu</a></p><h1>Family — Lesson Test</h1><p>20 questions. Select one answer for each question and check your score. The answer key is hidden in Teacher Area.</p><form id="quiz"></form><section class="panel"><button type="button" id="check">Check my score</button><p id="score" aria-live="polite"></p></section><section class="panel"><h2>Teacher Area · Answer Key</h2><p>Teacher use only. Enter the existing teacher password to reveal the answer key.</p><label for="pw">Teacher password</label><input id="pw" type="password" autocomplete="off"> <button type="button" id="unlock">Unlock answer key</button><p id="feedback" aria-live="polite"></p><div id="key" class="answer"><ol id="answers"></ol></div></section></main><script>const qs=[
["John is from…",["Canada","Syria","Britain"],0,"The passage says John is from Canada."],
["John is… years old.",["eight","ten","twelve"],1,"John says he is ten."],
["John’s mother is called…",["Olivia","Liza","Carla"],1,"His mother is Liza."],
["John’s father is called…",["Peter","Richard","Kevin"],0,"His father is Peter."],
["Laura is…",["one year old","ten years old","two years old"],0,"Laura is only one year old."],
["Olivia is John’s…",["mother","aunt","cousin"],1,"His father’s sister is his aunt."],
["Richard is John’s…",["uncle","brother","grandfather"],0,"His mother’s brother is his uncle."],
["John’s cat is called…",["Puppy","Lucy","Laura"],1,"Lucy is the cat."],
["John’s dog is called…",["Puppy","Lucy","Peter"],0,"Puppy is the dog."],
["Choose: She ___ got short hair.",["have","has","having"],1,"She has got."],
["She can ___ very well.",["cook","cooks","cooking"],0,"After can, use the base verb."],
["She loves my brother and ___.",["my","me","I"],1,"Me is the object pronoun."],
["My mother is my father’s…",["wife","sister","daughter"],0,"A wife is a female spouse."],
["My father is my mother’s…",["nephew","husband","cousin"],1,"A husband is a male spouse."],
["My uncle and aunt’s children are my…",["cousins","grandparents","nephews"],0,"Their children are cousins."],
["The plural of child is…",["childs","children","childes"],1,"Children is irregular."],
["The plural of wife is…",["wifes","wives","wifees"],1,"Wife becomes wives."],
["Choose the correct possessive for books belonging to students.",["student’s books","students’ books","students books"],1,"Plural students ending in s takes apostrophe after s."],
["Choose the correct possessive for toys belonging to children.",["childrens’ toys","children’s toys","childrens toys"],1,"Children is irregular and takes ’s."],
["Complete: I come from a ___ family.",["big","many","brothers"],0,"Big family is a correct expression."]
];const form=document.getElementById('quiz'),ans=document.getElementById('answers');qs.forEach((q,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(97+j)+') '+o+'</label>').join('');form.appendChild(s);const li=document.createElement('li');li.textContent=q[1][q[2]]+' — '+q[3];ans.appendChild(li)});document.getElementById('check').onclick=()=>{let score=0,count=0;qs.forEach((q,i)=>{const a=form.querySelector('input[name="q'+i+'"]:checked');if(a){count++;if(+a.value===q[2])score++}});document.getElementById('score').textContent='Score: '+score+' / 20 · Answered: '+count+' / 20.'};document.getElementById('unlock').onclick=()=>{const expected=String.fromCharCode(115,111,109,101,114,49,55,51);const ok=document.getElementById('pw').value===expected;document.getElementById('key').classList.toggle('show',ok);document.getElementById('feedback').textContent=ok?'Answer key unlocked.':'Incorrect password.'};</script></body></html>
