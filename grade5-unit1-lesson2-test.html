<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 5 Lesson 2 Test — Family</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap');*{box-sizing:border-box} :root{--accent:#8854d0;--soft:#eee2ff;--ink:#202642;--muted:#626b83;--paper:#fffdf8} body{margin:0;background:radial-gradient(circle at 8% 5%,#eee2ff 0,transparent 26%),linear-gradient(135deg,#fffaf2,#f3f7ff);color:var(--ink);font:16px 'Nunito',sans-serif;min-height:100vh}a{color:var(--accent);font-weight:800}a:hover{filter:saturate(1.3)}.banner{position:sticky;top:0;z-index:5;text-align:center;padding:13px 16px;background:linear-gradient(100deg,var(--accent),#8854d0);color:white;font-weight:900;box-shadow:0 5px 18px #20264218}.banner a{color:white;text-decoration:underline}.wrap{max-width:1080px;margin:auto;padding:28px}h1,h2,h3{font-family:'Outfit','Nunito',sans-serif;line-height:1.2}h1{font-size:clamp(2rem,4vw,3.5rem);letter-spacing:-1px;color:var(--ink);margin:18px 0}h2{color:var(--accent);font-size:1.45rem}p,li{line-height:1.8}.panel,.question,.card{background:rgba(255,255,255,.92);border:1px solid #e8eaf2;border-top:5px solid var(--accent);border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 12px 32px #25304a0c}.card{display:block;color:var(--ink);text-decoration:none;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #25304a18;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.brand{color:var(--accent);font-weight:900;letter-spacing:2px}.hero{padding:24px 0}.hero h1{color:var(--accent)}.muted{color:var(--muted);line-height:1.8}.ar{direction:rtl;text-align:right;color:#36415f;line-height:2;background:var(--soft);padding:12px 16px;border-radius:14px}button{padding:11px 17px;border:0;border-radius:12px;background:var(--accent);color:white;font:800 15px 'Nunito',sans-serif;cursor:pointer;box-shadow:0 5px 12px #20264218;transition:transform .15s,filter .15s}button:hover{transform:translateY(-1px);filter:brightness(.96)}.answer{display:none;background:var(--soft);border:1px solid #e4e7f0;border-radius:14px;padding:14px;color:var(--ink);margin-top:10px}.answer.show{display:block}label{display:block;margin:10px 0}input[type=password],input[type=text],input[type=number],select{padding:11px 13px;border-radius:10px;background:white;border:1px solid #d6dbea;color:var(--ink);font:inherit}table{border-collapse:separate;border-spacing:0;width:100%;overflow:hidden;border-radius:12px;background:white}td,th{border-bottom:1px solid #e8eaf2;padding:12px;text-align:left}th{background:var(--soft);color:var(--ink);font-weight:900}.footer{margin-top:30px;border-top:1px solid #e2e6f0;padding:18px 0;color:var(--muted)}.arrow{color:var(--accent)}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:17px}.panel,.question,.card{padding:17px}}</style></head><body data-lesson-nav="grade5-unit1-lesson2" data-nav-page="test"><div class="banner">المهندس سومر شاهين: <a href="tel:0930215022">0930215022</a></div><main class="wrap"><p><a href="grade5-unit1-lesson2.html">← Lesson 2 menu</a></p><h1>Family — Lesson Test</h1><p>20 questions. Select one answer for each question and check your score. The answer key is hidden in Teacher Area.</p><form id="quiz"></form><section class="panel"><button type="button" id="check">Check my score</button><p id="score" aria-live="polite"></p></section><section class="panel"><h2>Teacher Area · Answer Key</h2><p>Teacher use only. Enter the existing teacher password to reveal the answer key.</p><label for="pw">Teacher password</label><input id="pw" type="password" autocomplete="off"> <button type="button" id="unlock">Unlock answer key</button><p id="feedback" aria-live="polite"></p><div id="key" class="answer"><ol id="answers"></ol></div></section></main><script>const qs=[
["John is from…",["Canada","Syria","Britain"],0,"The passage says John is from Canada."],
["John is… years old.",["eight","ten","twelve"],1,"John says he is ten."],

];const form=document.getElementById('quiz'),ans=document.getElementById('answers');qs.forEach((q,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(97+j)+') '+o+'</label>').join('');form.appendChild(s);const li=document.createElement('li');li.textContent=q[1][q[2]]+' — '+q[3];ans.appendChild(li)});document.getElementById('check').onclick=()=>{let score=0,count=0;qs.forEach((q,i)=>{const a=form.querySelector('input[name="q'+i+'"]:checked');if(a){count++;if(+a.value===q[2])score++}});document.getElementById('score').textContent='Score: '+score+' / 20 · Answered: '+count+' / 20.'};document.getElementById('unlock').onclick=()=>{const expected=String.fromCharCode(115,111,109,101,114,49,55,51);const ok=document.getElementById('pw').value===expected;document.getElementById('key').classList.toggle('show',ok);document.getElementById('feedback').textContent=ok?'Answer key unlocked.':'Incorrect password.'};</script><script src="lesson-navigation.js" defer></script><script src="lesson-content-navigation.js" defer></script></body></html>
