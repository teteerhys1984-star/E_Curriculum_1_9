<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 5 Lesson Test</title><style>body{font:16px Arial;background:#fffaf1;color:#293653;max-width:850px;margin:auto;padding:20px}.activity{background:white;border:1px solid #dfe6f4;border-radius:14px;padding:14px;margin:12px 0}button{padding:11px 15px;background:#6747e8;color:white;border:0;border-radius:9px;cursor:pointer}a{color:#6543d8}</style></head><body><p><a href="grade5-unit1-lesson1.html">← Lesson menu</a></p><h1>Grade 5 · Unit 1 · Lesson 1 Test</h1><p>20 questions. Choose an answer, then check your score. Listening-only textbook answers are not included.</p><form id="quiz"></form><button id="check" type="button">Check test</button><p id="score" aria-live="polite"></p><script>const qs=[["A classroom is a place to…",["learn with a teacher","play on swings","borrow books"],0],["Where do you have science?",["In the library","In the science lab","In the bathroom"],1],["A computer lab contains…",["computers","washbasins","swings"],0],["You borrow books from the…",["playground","library","corridor"],1],["You should walk in the…",["corridor","science lab only","bathroom"],0],["I ___ to listen to the teacher.",["has","have","does"],1],["She ___ to arrive on time.",["have","has","do"],1],["Do we ___ to wear a uniform?",["has","have","having"],1],["Does he have to…?",["Yes, he does.","Yes, he do.","Yes, he has."],0],["We ___ have to bring a sandwich; there is a canteen.",["doesn't","don't","hasn't"],1],["“Don't have to” means…",["not necessary","forbidden","must do"],0],["They ___ to follow instructions.",["has","have","does"],1],["Does Nadia ___ to wear a skirt?",["has","have","having"],1],["Choose the correct sentence.",["She have to listen.","She has to listen.","She does has to listen."],1],["The passage says children in Syria start basic school at…",["five","six","eleven"],1],["In Britain, secondary school starts at…",["age eleven","age fifteen","age six"],0],["Both countries require special exams for…",["the playground","university","the bathroom"],1],["Which is a school rule?",["We have to keep the classroom tidy.","We has to tidy.","We have tidy to."],0],["Arrange stages from earliest to latest.",["Secondary → Nursery → Basic","Nursery → Basic → Secondary","Basic → Secondary → Nursery"],1],["Complete: I have science ___ the science lab.",["on","in","at"],1]];const f=document.getElementById('quiz');qs.forEach((q,i)=>{const d=document.createElement('div');d.className='activity';d.innerHTML='<p><b>'+(i+1)+'.</b> '+q[0]+'</p>'+q[1].map((o,j)=>'<label style="display:block;margin:8px 0"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('');f.appendChild(d)});document.getElementById('check').onclick=()=>{let n=0;qs.forEach((q,i)=>{const a=document.querySelector('input[name=q'+i+']:checked');if(a&&Number(a.value)===q[2])n++});document.getElementById('score').textContent='Score: '+n+' / 20. Review the lesson and try again.'};</script></body></html>
